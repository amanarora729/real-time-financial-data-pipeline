  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: airflow-webserver
    depends_on:
      - airflow-init
    restart: "no"
    ports:
      - "8085:8080"
    environment:
      - AIRFLOW_CORE_EXECUTOR=SequentialExecutor
      - AIRFLOW_CORE_LOAD_EXAMPLES=False
      - AIRFLOW_CORE_PARALLELISM=1
      - AIRFLOW_WEBSERVER_WORKERS=1
      - AIRFLOW_WEBSERVER_WEB_SERVER_WORKER_TIMEOUT=120
      - AIRFLOW_CORE_DAGBAG_IMPORT_TIMEOUT=30
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow-data:/opt/airflow
    command: webserver
    mem_limit: 512m
    cpus: 0.5
    networks:
      - codewithaman


  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
    command: scheduler
    environment:
      - AIRFLOW_CORE_EXECUTOR=SequentialExecutor
      - AIRFLOW_CORE_PARALLELISM=1
      - AIRFLOW_SCHEDULER_MAX_THREADS=1
      - AIRFLOW_SCHEDULER_DAG_DIR_LIST_INTERVAL=60
    volumes:
      - ./dags:/opt/airflow/dags
      - ./airflow-data:/opt/airflow
    mem_limit: 512m
    cpus: 0.5
    networks:
      - codewithaman
volumes:
  broker_data_1:
  controller_data_1:
  cassandra_data:

networks:
  codewithaman:

